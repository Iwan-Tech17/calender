<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Planner & Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom scrollbar for aesthetic */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 1px;
            background-color: #e2e8f0;
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .day-cell {
            min-height: 120px;
            transition: all 0.2s ease;
        }

        .event-pill {
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Prevent text selection on quick clicks */
        .no-select {
            user-select: none;
        }
    </style>
</head>
<body class="text-gray-800 flex flex-col min-h-screen">

    <div class="container mx-auto px-4 py-8 flex-grow max-w-6xl flex flex-col">
        <!-- Header -->
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 bg-white p-6 rounded-xl shadow-sm">
            <div class="flex items-center gap-4 mb-4 sm:mb-0">
                <div class="bg-blue-600 text-white p-3 rounded-lg shadow-md">
                    <i class="fa-solid fa-calendar-days text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">Planner</h1>
                    <p class="text-sm text-gray-500">Organize your schedule effortlessly</p>
                </div>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="btn-prev" class="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
                <h2 id="current-month-display" class="text-xl font-semibold w-48 text-center">Month Year</h2>
                <button id="btn-next" class="p-2 rounded-lg hover:bg-gray-100 transition text-gray-600">
                    <i class="fa-solid fa-chevron-right"></i>
                </button>
                <button id="btn-today" class="ml-2 px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium rounded-lg transition text-sm">
                    Today
                </button>
            </div>
        </header>

        <!-- Calendar Container -->
        <div class="bg-white rounded-xl shadow-sm flex-grow flex flex-col overflow-hidden">
            <!-- Days of week header (Mon - Sun) -->
            <div class="grid grid-cols-7 bg-gray-50 border-b border-gray-200 no-select">
                <div class="py-3 text-center text-sm font-semibold text-gray-600 uppercase tracking-wider">Mon</div>
                <div class="py-3 text-center text-sm font-semibold text-gray-600 uppercase tracking-wider">Tue</div>
                <div class="py-3 text-center text-sm font-semibold text-gray-600 uppercase tracking-wider">Wed</div>
                <div class="py-3 text-center text-sm font-semibold text-gray-600 uppercase tracking-wider">Thu</div>
                <div class="py-3 text-center text-sm font-semibold text-gray-600 uppercase tracking-wider">Fri</div>
                <div class="py-3 text-center text-sm font-semibold text-yellow-600 uppercase tracking-wider bg-yellow-50/50">Sat</div>
                <div class="py-3 text-center text-sm font-semibold text-yellow-600 uppercase tracking-wider bg-yellow-50/50">Sun</div>
            </div>
            
            <!-- Calendar Grid -->
            <div id="calendar-grid" class="calendar-grid flex-grow">
                <!-- Days will be generated by JS -->
            </div>
        </div>
        
        <div class="mt-4 flex flex-wrap gap-4 text-xs text-gray-500 justify-center">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-100 border border-blue-300"></span> Task</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-100 border border-purple-300"></span> Appointment</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-orange-100 border border-orange-300"></span> Event</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500"></span> Holiday</span>
            <span class="ml-4 italic"><i class="fa-solid fa-mouse-pointer text-gray-400 mr-1"></i> Left click day to add. Right click event to delete.</span>
        </div>
    </div>

    <!-- Add Event Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md mx-4 transform scale-95 transition-transform duration-200" id="add-modal-content">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-lg font-bold text-gray-800" id="modal-date-title">Add Entry</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="p-6 space-y-4">
                <input type="hidden" id="selected-date">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                    <input type="text" id="event-title" placeholder="e.g. Doctor's Appointment" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                    <select id="event-type" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition bg-white">
                        <option value="Task">Task</option>
                        <option value="Appointment">Appointment</option>
                        <option value="Event">Event</option>
                        <option value="Holiday">Holiday</option>
                    </select>
                </div>
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-100 rounded-b-xl flex justify-end gap-3">
                <button id="btn-cancel-modal" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition font-medium text-sm">Cancel</button>
                <button id="btn-save-event" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium text-sm shadow-sm">Save Entry</button>
            </div>
        </div>
    </div>

    <!-- Delete Confirm Modal -->
    <div id="delete-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center z-50 transition-opacity opacity-0">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 transform scale-95 transition-transform duration-200" id="delete-modal-content">
            <div class="p-6">
                <div class="flex items-center justify-center w-12 h-12 mx-auto bg-red-100 rounded-full mb-4">
                    <i class="fa-solid fa-trash-can text-red-600 text-xl"></i>
                </div>
                <h3 class="text-lg font-bold text-gray-800 text-center mb-2">Delete Entry?</h3>
                <p class="text-sm text-gray-500 text-center" id="delete-event-text">Are you sure you want to delete this event?</p>
                <input type="hidden" id="delete-event-id">
                <input type="hidden" id="delete-event-date">
            </div>
            <div class="p-4 bg-gray-50 border-t border-gray-100 rounded-b-xl flex justify-end gap-3">
                <button id="btn-cancel-delete" class="px-4 py-2 text-gray-600 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition font-medium text-sm w-full">Cancel</button>
                <button id="btn-confirm-delete" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition font-medium text-sm shadow-sm w-full">Delete</button>
            </div>
        </div>
    </div>

    <script>
        // State
        let currentDate = new Date();
        let events = {}; // Format: { "YYYY-MM-DD": [ {id, title, type}, ... ] }

        // DOM Elements
        const calendarGrid = document.getElementById('calendar-grid');
        const currentMonthDisplay = document.getElementById('currentMonthDisplay');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnToday = document.getElementById('btn-today');
        const currentMonthText = document.getElementById('current-month-display');

        // Modal Elements
        const addModal = document.getElementById('add-modal');
        const addModalContent = document.getElementById('add-modal-content');
        const modalDateTitle = document.getElementById('modal-date-title');
        const selectedDateInput = document.getElementById('selected-date');
        const eventTitleInput = document.getElementById('event-title');
        const eventTypeInput = document.getElementById('event-type');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnCancelModal = document.getElementById('btn-cancel-modal');
        const btnSaveEvent = document.getElementById('btn-save-event');

        // Delete Modal Elements
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalContent = document.getElementById('delete-modal-content');
        const deleteEventText = document.getElementById('delete-event-text');
        const deleteEventIdInput = document.getElementById('delete-event-id');
        const deleteEventDateInput = document.getElementById('delete-event-date');
        const btnCancelDelete = document.getElementById('btn-cancel-delete');
        const btnConfirmDelete = document.getElementById('btn-confirm-delete');

        // Load data from LocalStorage
        function loadEvents() {
            try {
                const stored = localStorage.getItem('professionalPlannerEvents');
                if (stored) {
                    events = JSON.parse(stored);
                }
            } catch (e) {
                console.error("Error loading events", e);
                events = {};
            }
        }

        // Save data to LocalStorage
        function saveEvents() {
            localStorage.setItem('professionalPlannerEvents', JSON.stringify(events));
        }

        // Render Calendar
        function renderCalendar() {
            calendarGrid.innerHTML = '';
            
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            
            // Format header (e.g. October 2026)
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            currentMonthText.textContent = `${monthNames[month]} ${year}`;

            // First day of the month
            const firstDayOfMonth = new Date(year, month, 1);
            // JS getDay(): Sun=0, Mon=1, ..., Sat=6
            // We want Mon=0, Tue=1, ..., Sun=6
            let startingDay = firstDayOfMonth.getDay() - 1;
            if (startingDay === -1) startingDay = 6; // Sunday becomes 6

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            let gridHtml = '';

            // Previous month padding
            for (let i = 0; i < startingDay; i++) {
                const dayNum = daysInPrevMonth - startingDay + i + 1;
                gridHtml += `<div class="day-cell bg-gray-100 p-2 text-gray-400 opacity-60">
                    <span class="text-sm">${dayNum}</span>
                </div>`;
            }

            // Current month days
            for (let i = 1; i <= daysInMonth; i++) {
                const currentCellDate = new Date(year, month, i);
                // Calculate adjusted day of week (0=Mon, 6=Sun)
                let dayOfWeek = currentCellDate.getDay() - 1;
                if (dayOfWeek === -1) dayOfWeek = 6; 

                const isWeekend = (dayOfWeek === 5 || dayOfWeek === 6);
                
                // Format date string as YYYY-MM-DD
                const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                
                // Check if today
                const today = new Date();
                const isToday = (i === today.getDate() && month === today.getMonth() && year === today.getFullYear());
                
                // Check for events
                const dayEvents = events[dateString] || [];
                const hasHoliday = dayEvents.some(e => e.type === 'Holiday');

                // Determine styling based on requirements
                let bgClass = 'bg-white hover:bg-gray-50'; // default
                
                if (hasHoliday) {
                    bgClass = 'bg-green-100 hover:bg-green-200 border-green-200'; // Holiday is green
                } else if (isWeekend) {
                    bgClass = 'bg-yellow-50 hover:bg-yellow-100'; // Weekend is yellow
                }

                gridHtml += `
                <div class="day-cell ${bgClass} p-2 flex flex-col gap-1 cursor-pointer group" data-date="${dateString}">
                    <div class="flex justify-between items-start mb-1">
                        <span class="text-sm font-medium ${isToday ? 'bg-blue-600 text-white rounded-full w-6 h-6 flex items-center justify-center' : (isWeekend && !hasHoliday ? 'text-yellow-800' : (hasHoliday ? 'text-green-800' : 'text-gray-700'))}">
                            ${i}
                        </span>
                        <span class="opacity-0 group-hover:opacity-100 text-gray-400 text-xs transition">
                            <i class="fa-solid fa-plus"></i>
                        </span>
                    </div>
                    <div class="flex-grow flex flex-col gap-1 overflow-y-auto custom-scrollbar pr-1">
                        ${renderEventsHtml(dayEvents, dateString)}
                    </div>
                </div>`;
            }

            // Next month padding to complete the grid (up to 42 cells total usually, or just complete the row)
            const totalCells = startingDay + daysInMonth;
            const remainingCells = (7 - (totalCells % 7)) % 7;
            
            for (let i = 1; i <= remainingCells; i++) {
                gridHtml += `<div class="day-cell bg-gray-100 p-2 text-gray-400 opacity-60">
                    <span class="text-sm">${i}</span>
                </div>`;
            }

            calendarGrid.innerHTML = gridHtml;
            attachCellListeners();
        }

        // Generate HTML for events in a day
        function renderEventsHtml(dayEvents, dateString) {
            return dayEvents.map(ev => {
                let colorClasses = '';
                let icon = '';
                switch(ev.type) {
                    case 'Task':
                        colorClasses = 'bg-blue-100 text-blue-800 border-l-2 border-blue-400';
                        icon = 'fa-check-square';
                        break;
                    case 'Appointment':
                        colorClasses = 'bg-purple-100 text-purple-800 border-l-2 border-purple-400';
                        icon = 'fa-clock';
                        break;
                    case 'Event':
                        colorClasses = 'bg-orange-100 text-orange-800 border-l-2 border-orange-400';
                        icon = 'fa-star';
                        break;
                    case 'Holiday':
                        // Holiday tag should be green as requested
                        colorClasses = 'bg-green-500 text-white shadow-sm';
                        icon = 'fa-tree';
                        break;
                    default:
                        colorClasses = 'bg-gray-100 text-gray-800';
                        icon = 'fa-calendar';
                }

                return `
                <div class="event-pill text-xs px-2 py-1 rounded-sm truncate ${colorClasses} font-medium flex items-center gap-1 cursor-context-menu" 
                     title="${ev.title}" 
                     data-id="${ev.id}" 
                     data-date="${dateString}">
                    <i class="fa-solid ${icon} text-[10px]"></i>
                    <span class="truncate">${ev.title}</span>
                </div>`;
            }).join('');
        }

        // Attach event listeners to newly rendered cells
        function attachCellListeners() {
            const cells = document.querySelectorAll('.day-cell[data-date]');
            cells.forEach(cell => {
                cell.addEventListener('click', (e) => {
                    // Ignore if clicked directly on an event (handled separately via propagation block if needed, but here we just check target)
                    if(e.target.closest('.event-pill')) return;
                    
                    const date = cell.getAttribute('data-date');
                    openAddModal(date);
                });
            });

            const eventPills = document.querySelectorAll('.event-pill');
            eventPills.forEach(pill => {
                // Prevent click from triggering cell click
                pill.addEventListener('click', (e) => e.stopPropagation());
                
                // Right click to delete
                pill.addEventListener('contextmenu', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const id = pill.getAttribute('data-id');
                    const date = pill.getAttribute('data-date');
                    const title = pill.getAttribute('title');
                    openDeleteModal(id, date, title);
                });
            });
        }

        // Navigation controls
        btnPrev.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() - 1);
            renderCalendar();
        });

        btnNext.addEventListener('click', () => {
            currentDate.setMonth(currentDate.getMonth() + 1);
            renderCalendar();
        });

        btnToday.addEventListener('click', () => {
            currentDate = new Date();
            renderCalendar();
        });

        // Modal logic
        function openAddModal(dateString) {
            selectedDateInput.value = dateString;
            
            // Format date for title nicely
            const d = new Date(dateString);
            const formatted = d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
            modalDateTitle.textContent = `Add to ${formatted}`;
            
            eventTitleInput.value = '';
            eventTypeInput.value = 'Task';
            
            addModal.classList.remove('hidden');
            // Trigger reflow for animation
            void addModal.offsetWidth;
            addModal.classList.remove('opacity-0');
            addModalContent.classList.remove('scale-95');
            
            setTimeout(() => eventTitleInput.focus(), 100);
        }

        function closeAddModal() {
            addModal.classList.add('opacity-0');
            addModalContent.classList.add('scale-95');
            setTimeout(() => {
                addModal.classList.add('hidden');
            }, 200);
        }

        function openDeleteModal(id, date, title) {
            deleteEventIdInput.value = id;
            deleteEventDateInput.value = date;
            deleteEventText.innerHTML = `Are you sure you want to delete <strong>"${title}"</strong>?`;
            
            deleteModal.classList.remove('hidden');
            void deleteModal.offsetWidth;
            deleteModal.classList.remove('opacity-0');
            deleteModalContent.classList.remove('scale-95');
        }

        function closeDeleteModal() {
            deleteModal.classList.add('opacity-0');
            deleteModalContent.classList.add('scale-95');
            setTimeout(() => {
                deleteModal.classList.add('hidden');
            }, 200);
        }

        btnCloseModal.addEventListener('click', closeAddModal);
        btnCancelModal.addEventListener('click', closeAddModal);
        btnCancelDelete.addEventListener('click', closeDeleteModal);

        // Close on outside click
        addModal.addEventListener('click', (e) => {
            if (e.target === addModal) closeAddModal();
        });
        deleteModal.addEventListener('click', (e) => {
            if (e.target === deleteModal) closeDeleteModal();
        });

        // Save Event
        btnSaveEvent.addEventListener('click', () => {
            const date = selectedDateInput.value;
            const title = eventTitleInput.value.trim();
            const type = eventTypeInput.value;

            if (!title) {
                // simple visual feedback instead of alert
                eventTitleInput.classList.add('border-red-500', 'ring-red-500');
                setTimeout(() => eventTitleInput.classList.remove('border-red-500', 'ring-red-500'), 1000);
                return;
            }

            if (!events[date]) {
                events[date] = [];
            }

            events[date].push({
                id: Date.now().toString() + Math.random().toString(36).substring(2, 9),
                title,
                type
            });

            saveEvents();
            renderCalendar();
            closeAddModal();
        });

        // Delete Event
        btnConfirmDelete.addEventListener('click', () => {
            const id = deleteEventIdInput.value;
            const date = deleteEventDateInput.value;

            if (events[date]) {
                events[date] = events[date].filter(ev => ev.id !== id);
                if (events[date].length === 0) {
                    delete events[date]; // Clean up empty arrays
                }
                saveEvents();
                renderCalendar();
            }
            closeDeleteModal();
        });

        // Initial Load
        loadEvents();
        renderCalendar();

    </script>
</body>
</html>
